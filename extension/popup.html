<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Türkçe LLM DLP</title>
  <style>
    body { width: 300px; margin: 0; padding: 16px; color: #172033; background: #fff; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 17px; }
    label { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
    p { margin: 12px 0 0; color: #49566d; line-height: 1.45; }
    #status, #conversation, #service { margin-top: 12px; font-weight: 600; }
    .ok { color: #15803d; } .down { color: #b91c1c; }
    button { margin-top: 10px; font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #c9d1df; background: #fff; color: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b2130; color: #e8ecf4; } p { color: #a3adc2; }
      button { background: #232a3b; border-color: #3a4459; }
    }
  </style>
</head>
<body>
  <h1>Türkçe LLM DLP</h1>
  <label><input id="enabled" type="checkbox"> Gönderim öncesi kontrolü etkinleştir</label>
  <label><input id="preview" type="checkbox"> Göndermeden önce bulunanları göster</label>
  <div id="status" role="status"></div>
  <div id="service"></div>
  <div id="conversation"></div>
  <button id="clear" type="button" disabled>Bu sohbetin eşlemesini sil</button>
  <p>Kontrol, bilgisayarındaki 127.0.0.1:8000 servisine yapılır; servis ulaşılamazsa mesaj gönderilmez. Servisi arka planda sürekli çalıştırmak için scripts/macos/servisi_kur.command dosyasını bir kez çalıştırın. Eşlemeler yalnızca tarayıcı belleğinde tutulur, tarayıcı kapanınca silinir.</p>
  <script src="popup.js"></script>
</body>
</html>
